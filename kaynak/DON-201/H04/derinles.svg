<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Volt ölçeği: kıvılcımı hissetmek için yaklaşık 3000 volt gerekir; bazı çipler 100 volttan azıyla bozulur"><defs><linearGradient id="h4dr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient></defs><rect width="360" height="240" rx="18" fill="url(#h4dr)"/><text x="180" y="30" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#5b21b6" text-anchor="middle">Hissettiğin ve hissetmediğin elektrik</text><rect x="40" y="60" width="280" height="22" rx="11" fill="#e9d5ff"/><rect x="40" y="60" width="4" height="22" rx="2" fill="#ef4444"/><rect x="40" y="110" width="280" height="22" rx="11" fill="#e9d5ff"/><rect x="40" y="110" width="170" height="22" rx="11" fill="#8b5cf6"/><text x="48" y="54" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="start">Bazı çipleri bozan: 100 volttan az</text><text x="48" y="104" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#5b21b6" text-anchor="start">Hissetmen için: ≈ 3000 volt</text><rect x="40" y="160" width="280" height="22" rx="11" fill="#e9d5ff"/><rect x="40" y="160" width="280" height="22" rx="11" fill="#6d28d9"/><text x="48" y="154" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#4c1d95" text-anchor="start">Kıvılcımı görmen için: çok daha fazla</text><text x="180" y="214" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" fill="#6d28d9" text-anchor="middle">Hissetmediğin küçük bir kıvılcım bile çipe zarar verebilir.</text></svg>
